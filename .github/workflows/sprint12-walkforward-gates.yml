name: Sprint 12 walkforward policy gates
on:
  pull_request:
    paths:
      - 'research/walkforward_policy_gates.py'
      - 'tests/test_walkforward_policy_gates.py'
      - '.github/workflows/sprint12-walkforward-gates.yml'
  push:
    branches: [main]
    paths:
      - 'research/walkforward_policy_gates.py'
      - 'tests/test_walkforward_policy_gates.py'
      - '.github/workflows/sprint12-walkforward-gates.yml'
jobs:
  policy-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_walkforward_policy_gates.py' -v
