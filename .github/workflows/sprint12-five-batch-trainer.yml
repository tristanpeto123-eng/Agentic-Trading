name: Sprint 12 five-batch policy trainer
on:
  pull_request:
    paths:
      - 'research/five_batch_policy_trainer.py'
      - 'tests/test_five_batch_policy_trainer.py'
      - '.github/workflows/sprint12-five-batch-trainer.yml'
  push:
    branches: [main]
    paths:
      - 'research/five_batch_policy_trainer.py'
      - 'tests/test_five_batch_policy_trainer.py'
      - '.github/workflows/sprint12-five-batch-trainer.yml'
jobs:
  policy-trainer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_five_batch_policy_trainer.py' -v
