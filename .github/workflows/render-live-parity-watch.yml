name: Render live commit parity watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  verify-live-revision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm Render health responds with the exact current main commit
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          RENDER_HEALTH_URL: https://agentic-trading-iphone-preview-2026.onrender.com/health
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["EXPECTED_MAIN_SHA"].lower()
          url = os.environ["RENDER_HEALTH_URL"]
          assert len(expected) == 40, "No GitHub revision available"
          last = "no response"
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "ATL-Render-Commit-Parity/1"}
                  )
                  with urllib.request.urlopen(request, timeout=25) as result:
                      if result.status != 200:
                          raise RuntimeError(f"health returned HTTP {result.status}")
                      payload = json.load(result)
                  if payload.get("status") != "ok":
                      raise RuntimeError("unhealthy Render preview")
                  actual = payload.get("deployed_commit")
                  if actual == expected:
                      print(f"PASS: Render deployed commit matches GitHub main: {expected}")
                      break
                  last = f"deployed={actual or 'unknown'} expected={expected}"
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              print(f"Attempt {attempt}/6: release parity not yet established ({last})")
              if attempt < 6:
                  time.sleep(20)
          else:
              raise SystemExit(
                  "RENDER DEPLOYMENT DRIFT: " + last
                  + ". Verify Render GitHub app installation/repository access and"
                    " service Git credentials. Do not infer deploy success from SPA smoke."
              )
          PY
