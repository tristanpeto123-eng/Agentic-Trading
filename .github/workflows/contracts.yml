name: Agentic Trading - Research Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Install CPU-only neural research dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Test API, migrations and contracts
        run: python -m pytest backend/tests -q
      - name: Audit no broker execution endpoints
        run: python -c "from agentic_trading.api import app; assert not any('orders' in r.path or 'broker' in r.path for r in app.routes)"
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript + production build
        working-directory: frontend
        run: npm run build
  mobile-e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci_app.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser runner
        run: |
          python -m pip install -e './backend[dev]'
          cd frontend && npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Seed ephemeral CEO and start local application
        run: |
          echo "CEO_TEST_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          cd backend && alembic -c alembic.ini upgrade head
          cd ..
          # Seed the CEO in the next step after GITHUB_ENV is loaded.
      - name: Exercise mobile CEO flow
        run: |
          python scripts/seed_ci_ceo.py
          python -m uvicorn agentic_trading.api:app --host 127.0.0.1 --port 8000 > /tmp/agentic-api.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1) > /tmp/agentic-vite.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for i in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
                  urllib.request.urlopen('http://127.0.0.1:5173', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Local app did not start')
          PY
          cd frontend && npx playwright test
      - name: Upload mobile screenshots & traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint1-mobile-ux
          path: |
            frontend/screenshots/
            frontend/test-results/
          if-no-files-found: ignore
