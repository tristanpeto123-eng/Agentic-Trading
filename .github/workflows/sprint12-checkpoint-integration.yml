name: Sprint 12 checkpoint integration
on:
  pull_request:
    paths:
      - 'research/training_checkpoint_adapter.py'
      - 'tests/test_training_checkpoint_adapter.py'
      - '.github/workflows/sprint12-checkpoint-integration.yml'
  push:
    branches: [main]
    paths:
      - 'research/training_checkpoint_adapter.py'
      - 'tests/test_training_checkpoint_adapter.py'
      - '.github/workflows/sprint12-checkpoint-integration.yml'
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_training_checkpoint_adapter.py' -v
