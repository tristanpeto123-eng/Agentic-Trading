name: Myfxbook history adapter
on:
  pull_request:
    paths:
      - 'research/myfxbook_history.py'
      - 'tests/test_myfxbook_history.py'
      - '.github/workflows/myfxbook-history.yml'
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_myfxbook_history.py' -v
