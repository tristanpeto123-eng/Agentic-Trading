name: PostgreSQL Disaster Recovery Rehearsal (ephemeral CI)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: trading_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_ci -d trading_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGPASSWORD: ci-only-ephemeral
      PGHOST: localhost
      PGUSER: trading_ci
      PGPORT: '5432'
      DATABASE_URL: postgresql+psycopg://trading_ci:ci-only-ephemeral@localhost:5432/trading_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration and PostgreSQL clients
        run: |
          python -m pip install -e './backend[dev,postgres]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Migrate and seed only dummy CI data
        run: |
          cd backend
          alembic -c alembic.ini upgrade head
          cd ..
          psql -d trading_ci -v ON_ERROR_STOP=1 -c "INSERT INTO ceo_users (id,email,password_hash,role,created_at) VALUES ('00000000-0000-4000-8000-000000000001','recovery@example.invalid','ci-placeholder-not-a-real-hash','ceo',NOW())"
          test "$(psql -d trading_ci -Atc 'SELECT count(*) FROM ceo_users')" = "1"
      - name: Create private transient dump and restore to fresh database
        run: |
          set -euo pipefail
          umask 077
          pg_dump -d trading_ci --no-owner --no-acl --format=custom --file=/tmp/agentic-ci-recovery.dump
          test -s /tmp/agentic-ci-recovery.dump
          createdb trading_restored
          pg_restore -d trading_restored --no-owner --no-acl --exit-on-error /tmp/agentic-ci-recovery.dump
          test "$(psql -d trading_restored -Atc 'SELECT count(*) FROM ceo_users')" = "1"
          test "$(psql -d trading_restored -Atc 'SELECT version_num FROM alembic_version')" = "$(psql -d trading_ci -Atc 'SELECT version_num FROM alembic_version')"
      - name: Verify restored schema and migration idempotence
        env:
          DATABASE_URL: postgresql+psycopg://trading_ci:ci-only-ephemeral@localhost:5432/trading_restored
        run: |
          set -euo pipefail
          (cd backend && alembic -c alembic.ini upgrade head)
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          engine=create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              assert conn.scalar(text("SELECT count(*) FROM ceo_users"))==1
              assert conn.scalar(text("SELECT count(*) FROM alembic_version"))==1
              tables=set(inspect(engine).get_table_names())
              assert {"students","trade_experiences","training_checkpoints",
                      "research_policy_candidates","safety_latches",
                      "paper_pilot_requests"} <= tables
          print("Ephemeral PostgreSQL dump/restore/migrations verified; no real account data used.")
          PY
          rm -f /tmp/agentic-ci-recovery.dump
      - name: Assert broker execution remains absent after restoration
        run: |
          python - <<'PY'
          from agentic_trading.api import app
          assert not any("orders" in route.path or "broker" in route.path for route in app.routes)
          print("No broker order route exists.")
          PY
