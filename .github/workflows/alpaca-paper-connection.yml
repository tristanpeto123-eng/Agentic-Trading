name: Alpaca paper account connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-paper-account:
    name: Verify read-only Alpaca paper API access
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - name: Check paper account access (GET only)
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key_id = os.environ.get("APCA_API_KEY_ID", "")
          secret_key = os.environ.get("APCA_API_SECRET_KEY", "")
          if not key_id or not secret_key:
              print("FAILED: One or both Alpaca paper API secrets are missing.")
              sys.exit(1)

          # Validate secret formatting without printing values, prefixes or lengths.
          malformed = False
          for label, value in (("APCA_API_KEY_ID", key_id), ("APCA_API_SECRET_KEY", secret_key)):
              if value != value.strip():
                  print(f"FAILED: {label} has leading or trailing whitespace.")
                  malformed = True
              if any(char in value for char in ("\\n", "\\r", "\\t", '"', "'")):
                  print(f"FAILED: {label} contains a newline, tab or quotation mark.")
                  malformed = True
              if any(ord(char) < 32 or ord(char) > 126 for char in value):
                  print(f"FAILED: {label} contains a non-printable or non-ASCII character.")
                  malformed = True
          if malformed:
              sys.exit(1)
          if key_id == secret_key:
              print("FAILED: API Key ID and Secret Key are identical; check field mapping.")
              sys.exit(1)
          print("Credential presence and formatting checks passed (not proof of validity).")

          request = Request(
              "https://paper-api.alpaca.markets/v2/account",
              headers={
                  "APCA-API-KEY-ID": key_id,
                  "APCA-API-SECRET-KEY": secret_key,
                  "Accept": "application/json",
              },
              method="GET",
          )
          try:
              with urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      print("FAILED: Paper API returned an unexpected HTTP status.")
                      sys.exit(1)
                  account = json.load(response)
                  if not isinstance(account, dict) or not account.get("id"):
                      print("FAILED: Paper API response did not include an account identifier.")
                      sys.exit(1)
          except HTTPError as error:
              print(f"FAILED: Alpaca paper API rejected header authentication (HTTP {error.code}).")
              # Alpaca support can trace requests using this non-credential reference.
              request_id = error.headers.get("X-Request-ID", "")
              if re.fullmatch(r"[A-Za-z0-9_-]{8,128}", request_id):
                  print(f"Header request ID for Alpaca support: {request_id}")
              if error.code == 401:
                  # Distinct documented authentication method; same stored key pair.
                  # Never print the header, credentials, account body or identifiers.
                  print("DIAGNOSTIC: Retrying account GET using HTTP Basic authentication.")
                  token = base64.b64encode(
                      f"{key_id}:{secret_key}".encode("ascii")
                  ).decode("ascii")
                  alternate = Request(
                      "https://paper-api.alpaca.markets/v2/account",
                      headers={"Authorization": f"Basic {token}", "Accept": "application/json"},
                      method="GET",
                  )
                  try:
                      with urlopen(alternate, timeout=15) as second:
                          body = json.load(second)
                          if second.status == 200 and isinstance(body, dict) and body.get("id"):
                              print("DIAGNOSTIC: Basic authentication succeeded, but key-header authentication failed.")
                          else:
                              print("DIAGNOSTIC: Basic authentication returned an unexpected response.")
                  except HTTPError as secondary:
                      print(f"DIAGNOSTIC: HTTP Basic authentication also rejected (HTTP {secondary.code}).")
                      alternate_id = secondary.headers.get("X-Request-ID", "")
                      if re.fullmatch(r"[A-Za-z0-9_-]{8,128}", alternate_id):
                          print(f"Basic request ID for Alpaca support: {alternate_id}")
                      if secondary.code == 401:
                          print("Both supported authentication methods rejected this key pair. Verify its exact owning paper account with Alpaca.")
                  except (URLError, TimeoutError, ValueError, KeyError):
                      print("DIAGNOSTIC: Alternate method could not complete; check account association separately.")
              # Fail closed even if Basic succeeds: normal integration uses key headers.
              sys.exit(1)
          except (URLError, TimeoutError):
              print("FAILED: Alpaca paper API connection error or timeout.")
              sys.exit(1)
          except (ValueError, KeyError):
              print("FAILED: Alpaca paper API returned an unexpected response.")
              sys.exit(1)

          print("SUCCESS: Paper account credentials authenticate; read-only access verified.")
          print("No orders placed; account ID, balance and API keys not printed.")
          PY
