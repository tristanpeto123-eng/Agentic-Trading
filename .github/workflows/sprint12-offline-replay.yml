name: Sprint 12 qualified offline replay
on:
  pull_request:
    paths:
      - 'research/offline_replay_cli.py'
      - 'tests/test_offline_replay_cli.py'
      - '.github/workflows/sprint12-offline-replay.yml'
  push:
    branches: [main]
    paths:
      - 'research/offline_replay_cli.py'
      - 'tests/test_offline_replay_cli.py'
      - '.github/workflows/sprint12-offline-replay.yml'
jobs:
  replay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_offline_replay_cli.py' -v
